<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفاجأة عيد ميلاد ♡</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#563d63;background:radial-gradient(circle at 10% 15%,#eadcf5 0 2px,transparent 3px),radial-gradient(circle at 85% 30%,#e8d8f2 0 2px,transparent 3px),linear-gradient(135deg,#fff,#f7effb,#fff);overflow-x:hidden}.screen{min-height:100vh;padding:25px 16px;display:flex;align-items:center;justify-content:center}.card{width:min(900px,100%);text-align:center;background:#ffffffd9;border:1px solid #eadcf3;border-radius:28px;padding:30px 20px;box-shadow:0 14px 45px #6640821f}h1{font-size:clamp(42px,10vw,82px);margin:10px;color:#76508e}h2{color:#76508e}p{line-height:2;font-size:18px}button{font:inherit;border:0;border-radius:16px;padding:13px 23px;margin:7px;cursor:pointer;background:#8e67a7;color:white;box-shadow:0 8px 20px #6f488421}.alt{background:#eee3f4;color:#684b79;box-shadow:none}.hidden{display:none!important}input{width:min(350px,90%);padding:14px;border:2px solid #dbc7e8;border-radius:15px;font:inherit;text-align:center}.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:720px;margin:auto}.gift{min-height:145px;background:#f2e5f8;border:2px solid #d9c2e5;display:flex;align-items:center;justify-content:center;flex-direction:column}.gift.big{min-height:205px;background:#ead8f3;border-color:#b992ca;grid-row:span 2}.box{font-size:55px}.message{white-space:pre-line;text-align:right;background:#fff;border:1px solid #eadcf3;border-radius:20px;padding:20px;max-height:60vh;overflow:auto;line-height:2}.choices{display:flex;flex-wrap:wrap;justify-content:center}.choices button{min-width:170px;background:#f0e4f6;color:#654777;box-shadow:none}.balloon{position:fixed;bottom:-100px;width:46px;height:60px;border-radius:50%;background:#c6a0dd;opacity:.55;animation:up 10s linear infinite;pointer-events:none}.balloon:after{content:"";position:absolute;left:50%;top:58px;height:100px;border-left:1px solid #bda6c8}.a{left:8%}.b{left:25%;animation-delay:3s;width:38px;height:50px}.c{right:10%;animation-delay:1s}.d{right:27%;animation-delay:5s;width:38px;height:50px}@keyframes up{to{transform:translateY(-120vh) rotate(10deg)}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:8px;height:15px;background:#b98ad2;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}.end{font-size:40px;color:#7c5792;margin-top:18px}@media(max-width:650px){.gifts{grid-template-columns:1fr 1fr}.gift.big{grid-column:1/-1;grid-row:auto}}
</style></head><body>
<div class="balloon a"></div><div class="balloon b"></div><div class="balloon c"></div><div class="balloon d"></div>
<section id="home" class="screen"><div class="card"><h2>قبل ما تبدأ المفاجأة…</h2><h1>تحبني؟</h1><button onclick="go('birthday')">أحبك ♡</button></div></section>
<section id="birthday" class="screen hidden"><div class="card"><div style="font-size:42px">🎈 🎉 🎈</div><h1>Happy Birthday</h1><p>كل عام وأنت بخير ♡</p><button onclick="go('gifts')">الهدايا 🎁</button></div></section>
<section id="gifts" class="screen hidden"><div class="card"><h2>🎁 اختر هديتك</h2><div class="gifts"><button class="gift" onclick="msg('GIFT 01',t1)"><span class="box">🎁</span><b>GIFT 01</b></button><button class="gift" onclick="gift2()"><span class="box">🎁</span><b>GIFT 02</b></button><button class="gift big" onclick="gift5()"><span class="box">🔒🎁</span><b>GIFT 05</b><small>الهدية الأخيرة</small></button><button class="gift" onclick="gift3()"><span class="box">🎁</span><b>GIFT 03</b></button><button class="gift" onclick="msg('GIFT 04',t4)"><span class="box">🎁</span><b>GIFT 04</b></button></div></div></section>
<section id="question" class="screen hidden"><div class="card"><h2 id="qt"></h2><p id="qq"></p><div id="answers" class="choices"></div><button class="alt" onclick="go('gifts')">رجوع</button></div></section>
<section id="message" class="screen hidden"><div class="card"><h2 id="mt"></h2><div id="mc" class="message"></div><button onclick="go('gifts')">رجوع للهدايا 🎁</button></div></section>
<section id="code" class="screen hidden"><div class="card"><div style="font-size:65px">🔒</div><h2>ENTER THE CODE</h2><input id="codeInput" inputmode="numeric" maxlength="4" placeholder="••••"><br><button onclick="unlock()">فتح الهدية ✦</button><p id="wrong"></p></div></section>
<section id="final" class="screen hidden"><div class="card"><div style="font-size:60px">🎁✨🎈</div><h2>GIFT 05</h2><div id="finalText" class="message"></div><button onclick="celebrate()">اضغط هنا ✦</button><div id="end" class="end hidden">THE END ♡</div></div></section><div id="confetti" class="confetti"></div>
<script>
const t1=`هاي حبوبي هابيي بيرثديي تو يو يروحي كل عام وانت بالف خير كل عام و الحياة تضحك لك و حلوه زيك و زي حلاوتك كل عام ونحن سوا ومايفرقنا شيء اتمنى تكبر بسعادة`;
const t2=`تحسب خلصنا ؟ لسا يزوجي باقي وراك مشوار كبير تذكر اول شيء صار بيننا ؟ كنت اهددك ومافحياتي توقعت اني رح اطيح في حب الشخص اللي هددتو و كان افضل قرار سويتو فحياتي اني حبيتك و اليوم اعبرلك عن مشاعري في عيدميلادك`;
const t3=`دايم الحياة تعطي الناس نعم بس الفرق النعم تكون هيئتها مختلفة وانا نعمتي من هالدنيا هو انت و وجودك في حياتي من اعظم الاشياء و احبها لقلبي انت فكل عام وانت حبي وكل عام وانت تنورني`;
const t4=`كل عام وأنت بخير يا من أهدى لروحي معنى الحب يوم ميلادك بالنسبة لي مو مجرد تاريخ هو اليوم اللي بدأ فيه الكون يضيء بحضورك رغم المسافة اللي تفصلنا، إلا أن قلبي ما عرف البعد يوم يظل ملاصق لك يهمس باسمك، ويدعي و لك اتمنى من الله أن يجعل عامك هذا مليئا بالفرح وأن يكتب لك فيه ما تتمنى وأكثر. كل عام وأنت حبيبي القريب من قلبي، ولو كنت بعيد عن عيني`;
const tf=`يمكن دي آخر هدية بس هي اكتر هدية كنت ابي اوصلها لك لان مهما كتبت ومهما حاولت اوصف لك حبي لك و مكانتك عندي الكلام دايم يقصر عن اللي فقلبي لك ماكنت ادري ان شخص دخل حياتي بطريقة ما كنت اتوقعها ابداً يصير بعدها جزء من ايامي وتفاصيل حياتي و دنيتي تدري اني احب وجودك معايا احب تفاصيلك احب سوالفنا حتى احب الاشياء الصغيرة اللي يمكن انت ما تنتبه لها بس انا حافظتها فقلبي واليوم صار ميلادك ما اتمنى لك بس سنة حلوة اتمنى لك عمر مليان سعادة و راحة وحب واتمنى تكون محقق كل شيء تتمناه وتبيه اتمنى اكون من هالاشخاص اللي يشاركونك هالايام الحلوة فحياتك و المُره بعد الله لايجيبها لحياتك بس حتى لو ظهرت ايام مُره تذكر اني موجودة جنبك في كل خطوة احبك اححبك رغم المسافة اللي بيننا و المشاكل بس دايم احس حبي لك يزيد ماينقص ولا يقل و كنت احس انك دايم قريب لقلبي مو بعيد اتمنى مهما عدت الايام و مشت نبقى مع بعض و يبقى مكاني فقلبك و مكانك فقلبي مايتغير مع مرور الزمن كل عام وانتت حبيبيي و دنيتيي كل عامم وانا محظوظه فيك اكترر من قبل

عيد ميلاد سعيد يا حبوبي .
من حبوبتك`;
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');scrollTo(0,0)}
function msg(title,text){go('message');mt.textContent=title;mc.textContent=text}
function gift2(){go('question');qt.textContent='🎁 GIFT 02';qq.textContent='تذكر كيف كانت أول رسالة بيننا؟ وإيش صار بالضبط؟';answers.innerHTML='<button onclick="msg(\'GIFT 02\',t2)">أتذكرها ✦</button>'}
function gift3(){go('question');qt.textContent='🎁 GIFT 03';qq.textContent='وش اكتر شيء يخوفني ؟';answers.innerHTML='';[['A — الظلام','غلط لازم تصير تعرفني اكتر !'],['B — القطط','صح عليك بس مو الجواب الصح عندي خوف اكبر منهم لازم تعرفه !'],['C — الوحوش','ماتعرفني كويس !'],['D — فقدانك','لاتخليني احس بألم فقدانك']].forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>i===3?msg('GIFT 03',t3):alert(x[1]);answers.appendChild(b)})}
function gift5(){go('code');codeInput.value='';wrong.textContent=''}
function unlock(){if(codeInput.value==='1214'){go('final');finalText.textContent=tf;burst(35)}else wrong.textContent='Wrong code :('}
function burst(n){confetti.innerHTML='';for(let i=0;i<n;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*.8+'s';confetti.appendChild(e)}setTimeout(()=>confetti.innerHTML='',3500)}
function celebrate(){burst(55);end.classList.remove('hidden')}
</script></body></html>
